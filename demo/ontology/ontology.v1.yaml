# Ontology v1 — baseline ("기존 온톨로지") for the semiconductor / AI news KG demo.
# CUSTOMIZE: replace classes/relations with your domain. Downstream code generates from this file:
#   uid rule, unique constraints (scripts/reset.py), LLM output schema (pipeline/extract.py),
#   validation (pipeline/validate.py).
version: 1.0.0
name: semiconductor-ai-news (demo)

# key  = business key fields; uid = "<Class>:<key values joined by '/'>", e.g. "Company:sk-hynix"
# required = must be present on every node of the class
classes:
  Company:    {label_ko: 회사, key: [code], required: [code, name]}
  Product:    {label_ko: 제품, key: [code], required: [code, name],
               enums: {status: [announced, sampling, mass_production]}}
  Technology: {label_ko: 기술, key: [code], required: [code, name]}
  Country:    {label_ko: 국가, key: [code], required: [code, name]}
  Policy:     {label_ko: 정책·규제, key: [code], required: [code, name]}
  Document:   {label_ko: 문서, key: [doc_id], required: [doc_id, kind, title]}
  Chunk:      {label_ko: 문서 조각, key: [chunk_id], required: [chunk_id, text]}

# fact: true  -> LLM extraction target (v1 watch scope: HBM supply chain); carries certainty + evidence.
# no fact     -> loaded from the master list or baseline articles only, not extracted by the LLM in v1.
# key: [...]  -> relationship properties that are part of its identity (MERGE key):
#                SK hynix SUPPLIES NVIDIA {item: HBM3} and {item: HBM3E} are two different facts.
relations:
  HEADQUARTERED_IN: {from: Company, to: Country, label_ko: 본사 국가}
  ISSUED_BY:        {from: Policy, to: Country, label_ko: 시행 국가}
  TARGETS:          {from: Policy, to: Country, label_ko: 대상 국가}
  SUBSIDIZED_BY:    {from: Company, to: Policy, label_ko: 보조금 수혜, props: [amount, stage]}
  DEVELOPS:         {from: Company, to: Product, label_ko: 개발, fact: true}
  SUPPLIES:         {from: Company, to: Company, label_ko: 공급, fact: true, props: [item], key: [item]}
  USES_COMPONENT:   {from: Product, to: Product, label_ko: 부품 사용, fact: true}
  FABRICATED_BY:    {from: Product, to: Company, label_ko: 위탁 생산, fact: true, props: [process]}
  USES_TECH:        {from: Product, to: Technology, label_ko: 사용 기술, fact: true}
  RESTRICTED_BY:    {from: Product, to: Policy, label_ko: 규제 대상, fact: true}
  HAS_CHUNK:        {from: Document, to: Chunk, label_ko: 조각}
  MENTIONS:         {from: Chunk, to: "*", label_ko: 언급}

# Facts that set a node property instead of adding a relationship.
property_facts:
  PRODUCT_STATUS: {class: Product, property: status, label_ko: 제품 상태}

certainty: [confirmed, suspected]
