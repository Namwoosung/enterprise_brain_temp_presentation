# Reference sources already in the team's hands — DUMMY. reset.py builds the baseline KG (run 0)
# from the master (entities.yaml) + the facts these sources support.
#   official: cmms | alarm_log  -> system of record ("기준 시스템"); validate.py compares new
#                                  claims against it (e.g. completion time = CMMS)
#   kind: doc                   -> approved documents (SOP, meeting material, vendor bulletin)
# Fact forms:
#   {s: <uid>, p: <RELATION>, o: <uid>, props: {...}}
#   {s: <uid>, p: WORK_STATUS | EQUIPMENT_STATE, value: <enum>}
# CUSTOMIZE: replace with your own exports / documents.
docs:
