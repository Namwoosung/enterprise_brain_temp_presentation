<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>발표자 노트 · 발표 2</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  html,body{margin:0;background:#0B1020;color:#EFF4FF;font-family:var(--sans)}
  main{max-width:1100px;margin:0 auto;padding:28px 32px 80px}
  header{display:flex;align-items:baseline;gap:16px;border-bottom:1.5px solid #33415D;padding-bottom:12px}
  header .id{font:700 18px var(--mono);color:#5EEAD4}
  header h1{font-size:30px;margin:0}
  header .sync{margin-left:auto;font:14px var(--mono);color:#9EACC8}
  .convey{font-size:20px;color:#9EACC8;margin:14px 0 22px}
  h2{font:600 15px var(--mono);color:#9EACC8;text-transform:uppercase;letter-spacing:.06em;margin:26px 0 8px}
  .script p{font-size:22px;line-height:1.7;margin:0 0 12px}
  .md{font-size:17px;line-height:1.6;color:#C9D3E8;white-space:pre-wrap}
  .help{font:14px var(--mono);color:#9EACC8;margin-top:30px}
</style>
</head>
<body>
<main>
  <header><span class="id" id="id"></span><h1 id="title"></h1><span class="sync" id="sync"></span></header>
  <div class="convey" id="convey"></div>
  <h2>대본</h2><div class="script" id="script"></div>
  <h2>함께 고민할 점</h2><div class="md" id="discuss"></div>
  <h2>개념 정리</h2><div class="md" id="concept"></div>
  <h2>출처</h2><div class="md" id="src"></div>
  <div class="help">← → 로 장 이동 · 발표 창과 같은 브라우저에서 열면 현재 장을 따라갑니다(지원되는 경우)</div>
</main>
<script src="js/data/notes.js"></script>
<script>
(function () {
  const ids = Object.keys(window.NOTES).sort();
  let i = 0, step = 1;
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const clean = s => esc(s).replace(/\*\*(.+?)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1');
  function show() {
    const n = NOTES[ids[i]];
    document.getElementById('id').textContent = ids[i];
    document.getElementById('title').textContent = n.title;
    document.getElementById('sync').textContent = `스텝 ${step}`;
    document.getElementById('convey').innerHTML = clean(n.convey);
    document.getElementById('script').innerHTML = n.script.split('\n').map(l => `<p>${clean(l)}</p>`).join('');
    document.getElementById('discuss').innerHTML = clean(n.discuss);
    document.getElementById('concept').innerHTML = clean(n.concept);
    document.getElementById('src').innerHTML = clean(n.src);
    scrollTo(0, 0);
  }
  function go(id, s) { const k = ids.indexOf(id); if (k >= 0) { i = k; step = s || 1; show(); } }
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { i = Math.min(ids.length - 1, i + 1); step = 1; show(); }
    if (e.key === 'ArrowLeft') { i = Math.max(0, i - 1); step = 1; show(); }
  });
  try { const ch = new BroadcastChannel('eb-deck'); ch.onmessage = e => go(e.data.id, e.data.step); } catch (e) {}
  addEventListener('storage', e => { if (e.key === 'eb-deck-pos') try { const v = JSON.parse(e.newValue); go(v.id, v.step); } catch (x) {} });
  try { const v = JSON.parse(localStorage.getItem('eb-deck-pos')); if (v) { const k = ids.indexOf(v.id); if (k >= 0) { i = k; step = v.step; } } } catch (e) {}
  show();
})();
</script>
</body>
</html>
