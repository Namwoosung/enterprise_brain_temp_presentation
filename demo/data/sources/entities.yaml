# Known entities ("기준 마스터"). reset.py loads all of them into the baseline graph.
# uid = "<Class>:<code>" (see ontology key). CUSTOMIZE: replace with your own master list.
#
# prompt: false  -> in the baseline graph and the lexicon, but NOT in the LLM extraction prompt's
#                   "known entities" list. The prompt lists only the entities the watched topic
#                   (HBM supply chain) needs; a long master list makes the prompt longer and noisier.
#                   Changing which entities are in the prompt changes the prompt hash -> re-record
#                   (LLM_MODE=live) before presenting.
# country / issued_by / targets -> structural relations created from the master (HEADQUARTERED_IN,
#                   ISSUED_BY, TARGETS), not from documents.
entities:
  # ---- in the extraction prompt (v1 watch list)
