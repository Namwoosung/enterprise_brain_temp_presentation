# STT pronunciation -> written form, applied before lexicon lookup (pipeline/normalize.py).
# STT engines often spell English acronyms and numbers in Hangul.
# CUSTOMIZE: add the readings your STT engine produces.
version: 1.0.0

# Plain replacements (longest key is applied first).
map:
  씨오더블유오에스: CoWoS
  에이치비엠: HBM
  티에스엠씨: TSMC
  엔비디아: NVIDIA
  포엔피: 4NP
  에이치 이백: H200
  에이치 이십: H20
  비 이백: B200
  엠오유: MOU

# Replacements that are only safe right after a given written form
# ("엘" alone is a normal Korean syllable; only "CoWoS 엘" means CoWoS-L).
after:
  - {prev: CoWoS, say: 엘, write: "-L"}
  - {prev: CoWoS, say: 에스, write: "-S"}
  - {prev: HBM, say: 쓰리 이, write: "3E"}
  - {prev: HBM, say: 쓰리이, write: "3E"}
  - {prev: HBM, say: 포, write: "4"}
