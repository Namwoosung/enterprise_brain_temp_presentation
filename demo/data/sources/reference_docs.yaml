  - id: DOC-P088
    baseline: true
    kind: doc
    date: 2026-02-25
    system: 그룹웨어 (설비기술팀 공유폴더)
    source: 설비기술팀/회의자료/2026-02-25 ETCH 점검 계획.pptx p.4
    title: ETCH-X300 점검 계획 회의자료 p.4 — PT-V42 교체 적용 조건
    summary: PT-V42 교체는 ETCH-X300 계열에만 적용한다. 교체 후 24시간 챔버 압력을 모니터링하고, 기준 범위(0.45 ~ 0.55 Torr)를 벗어나면 스로틀 밸브를 점검한다.
    facts:
      - {s: "EquipmentModel:ETCH-X300", p: HAS_PART, o: "PartType:PT-V42"}
      - {s: "EquipmentModel:ETCH-X300", p: HAS_PART, o: "PartType:TV-08"}
