  - id: SOP-ETCH-012
    baseline: true
    kind: doc
    date: 2025-09-01
    system: 사내 위키 (설비기술)
    source: wiki/equipment/etch/SOP-ETCH-012 r4
    title: 식각 설비 챔버 압력 이상 대응 절차 (SOP-ETCH-012)
    summary: ALM-312 발생 시 압력센서(PT-V42) 드리프트와 스로틀 밸브(TV-08) 고착을 먼저 확인한다. 센서는 기준 게이지와 비교하고, 밸브는 위치 값과 응답 시간을 본다.
    facts:
      - {s: "Alarm:ALM-312", p: INDICATES, o: "FailureMode:FM-PT-DRIFT"}
      - {s: "Alarm:ALM-312", p: INDICATES, o: "FailureMode:FM-TV-STICK"}
