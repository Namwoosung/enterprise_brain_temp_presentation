# 단계마다 "개발자가 한 일". 웹 상단의 "개발자가 한 일" 토글이 이 파일을 읽습니다.
# ref가 가리키는 코드 · 정의 · 설정은 서버가 실제 파일에서 그때그때 꺼내 보여 줍니다(코드와 화면이 어긋나지 않게).
# 검사: python -m pytest -q (모든 ref가 실제로 존재하는지 확인하는 테스트 포함)
#
# kind     code     직접 짠 코드
#          define   직접 정의한 기준 (스키마 · 사전 · 마스터 데이터 · 업무 질문)
#          config   설정값 (임계값 · 패턴 목록)
#          prompt   LLM에게 준 지시 (직접 씀)
#          llm      LLM이 맡은 일 (개발자가 만든 것이 아님)
#          platform 가져다 쓴 것 (개발자는 설치 · 연결만)
# ref      {file, symbol}  함수 · 클래스 · 상수의 소스 (Resolver.resolve처럼 클래스.메서드도 됨)
#          {file, key}     YAML 블록 원문 (점으로 구분: cleaning.mail)
#          {file, lines}   파일의 일부 줄 [시작, 끝]
#          {special}       prompt_system(채워진 시스템 프롬프트) · llm_settings(호출 설정)
steps:
  overview:
    label: 기준 KG (run 0)
    llm: false
    summary: 기준 그래프는 개발자가 쓴 마스터 · 기사 YAML을 직접 짠 Cypher로 넣은 것입니다. Neo4j는 저장하고 질의를 실행하고 그림을 그려 줄 뿐, 구조를 만들어 주지 않습니다.
    flow:
      - 데모 DB인지 확인하고 비움 (graph.is_demo_db · wipe)
      - 온톨로지의 클래스마다 유니크 제약 생성 (graph.create_constraints)
      - 마스터 개체를 노드로, country · issued_by · targets를 관계로 (graph.load_baseline)
      - baseline 기사의 사실을 관계 · 상태로, 기사는 Document 노드로 (graph.load_baseline)
      - 업무 질문(CQ) 5개를 실행해 run 0 답을 저장 (diff.snapshot_cq)
    items:
      - kind: define
        title: 온톨로지(스키마) 정의
        what: 클래스 · 키 · 필수 속성 · 허용 값, 관계의 방향과 속성. 이 파일 하나에서 DB 제약, LLM 프롬프트의 관계 목록, 검증 규칙이 만들어집니다.
        ref: {file: ontology/ontology.v1.yaml, key: classes}
      - kind: define
        title: 관계 정의
        what: fact true인 관계만 LLM이 추출 대상으로 씁니다. 나머지는 마스터 · 기사에서만 들어옵니다.
        ref: {file: ontology/ontology.v1.yaml, key: relations}
      - kind: define
        title: 마스터 개체 (기준 노드)
        what: 회사 · 제품 · 기술 · 국가 · 정책 목록. 실제 사내라면 MES · CMMS 마스터에서 가져올 부분을 YAML로 직접 썼습니다.
        ref: {file: data/sources/entities.yaml, lines: [1, 40]}
      - kind: define
        title: 기사 코퍼스 (기준 엣지 + 검증 대조용 원천)
        what: 공개 기사를 직접 요약하고, 기사마다 뒷받침하는 사실을 uid로 적었습니다. baseline true는 기준 그래프에, false는 검증 대조에만 씁니다.
        ref: {file: data/sources/news_corpus.yaml, lines: [1, 40]}
      - kind: code
        title: 기준 그래프 적재
        what: 마스터 → 노드, 구조 필드 → 관계, 기사 사실 → 관계 · 상태. 노드는 키로 하나씩 MERGE한 뒤 관계를 MERGE합니다.
        ref: {file: pipeline/graph.py, symbol: load_baseline}
      - kind: code
        title: 제약 생성
        what: 온톨로지 클래스 목록을 읽어 유니크 제약을 만듭니다. 다른 도메인 버전의 제약은 지웁니다.
        ref: {file: pipeline/graph.py, symbol: create_constraints}
      - kind: code
        title: 노드 · 관계 MERGE 공통 함수
        what: 패턴 전체를 MERGE하면 생기는 중복을 피하려고 노드 키 → 관계 순서로 씁니다. 관계 키(예 SUPPLIES.item)도 온톨로지에서 읽습니다.
        ref: {file: pipeline/graph.py, symbol: merge_rel}
      - kind: define
        title: 업무 질문 (CQ)
        what: 그래프가 업무에 답하는지 확인할 질문 5개를 Cypher로 고정했습니다. 적재할 때마다 전/후를 비교합니다.
        ref: {file: config/demo.yaml, key: cq}
      - kind: platform
        title: Neo4j 5 Community
        did: 따로 설치하고 실행, 비밀번호를 .env에 적음. 플러그인 없음.
        gave: [노드 · 관계 저장, Cypher 실행, 유니크 제약, Neo4j Browser(그래프 그림)]
      - kind: code
        title: Neo4j Browser 중계 포트
        what: Browser가 iframe을 막는 헤더를 보내서, 그 헤더만 빼고 그대로 전달하는 작은 프록시를 만들었습니다. Browser 자체는 고치지 않았습니다.
        ref: {file: server/app.py, symbol: BrowserProxy}
      - kind: code
        title: 이 데모 웹 화면
        what: 단계별 입력 · 결과를 보여 주는 화면(web/)과 JSON API(server/app.py). 설명용이고 KG 구축에 꼭 필요한 부분은 아닙니다.
        ref: {file: server/app.py, symbol: App}
  collect:
    label: 1 · 수집
    llm: false
    summary: 파일을 읽어 원본을 그대로 두고, 수집 기록(출처 id · 해시 · 버전 · 시각)을 남기는 코드만 직접 짰습니다. LLM과 외부 플랫폼은 쓰지 않습니다.
    flow:
      - config의 inputs에서 파일 경로를 찾음 (common.input_def)
      - 원문을 읽고 머리말(--- ... ---)과 본문을 나눔 (common.split_front_matter)
      - 원문 전체의 sha256을 계산
      - 이전 수집 기록과 해시를 비교해 같으면 같은 버전, 다르면 버전 +1
      - runs/<입력>/collect.json에 기록 저장 (원본 파일은 수정하지 않음)
    items:
      - kind: code
        title: 수집 단계
        what: 위 순서 그대로입니다.
        ref: {file: pipeline/collect.py, symbol: run}
      - kind: code
        title: 머리말 분리
        what: md 파일 맨 위 YAML 머리말을 메타데이터로 읽습니다.
        ref: {file: pipeline/common.py, symbol: split_front_matter}
      - kind: config
        title: 입력 목록
        what: 어떤 파일을 어떤 순서로 넣을지.
        ref: {file: config/demo.yaml, key: inputs}
      - kind: define
        title: 입력 형식 (머리말 필수 항목)
        what: doc_id · kind · title · date를 꼭 넣게 정했습니다. date는 '어제', '3월' 같은 표현의 기준이 됩니다.
        ref: {file: data/inputs/mail_hbm_update.md, lines: [1, 9]}
      - kind: platform
        title: Python 표준 라이브러리 · PyYAML
        did: import만
        gave: [hashlib(sha256), 파일 읽기, YAML 파싱]
    later: 실서비스에서는 소스별 커넥터(메일 API, CMMS export, 위키 웹훅), 증분 수집, 권한 기록을 따로 만들어야 합니다.
  clean:
    label: 2 · 정제
    llm: false
    summary: 무엇을 지우고 무엇으로 바꿀지 정하는 규칙을 전부 직접 짰습니다(정규식 + 사전 조회). 패턴과 단어 목록은 설정 파일과 사전으로 뺐습니다. LLM은 쓰지 않습니다.
    flow:
      - 문서 종류로 나눔 (mail · meeting_stt)
      - 메일 — 회신 체인 · 인용(>) · 서명 · 고지문 · 맺음말을 지우고 이유를 남김 (clean_mail)
      - STT — 화자 라벨을 사람으로, (불명확) · 반복 · 간투사 제거, 너무 짧은 발화 제거 (clean_stt)
      - STT 발음 복원 — '에이치비엠 쓰리 이' → HBM3E (restore_phonetic)
      - 상대 날짜 → 작성일 기준 절대 날짜 (resolve_dates)
      - 사전으로 이미 아는 개체 언급 찾기 (alias_index · scan_mentions)
      - H20 / H200처럼 비슷하지만 다른 코드 경고 (near_misses)
    items:
      - kind: code
        title: 메일 정제
        what: 줄마다 지울지 판단하고 지운 이유를 남깁니다.
        ref: {file: pipeline/clean.py, symbol: clean_mail}
      - kind: code
        title: STT 정제
        what: "'[hh:mm:ss] 화자: 내용' 형식을 읽어 간투사 · 반복 · 불명확 구간을 처리합니다."
        ref: {file: pipeline/clean.py, symbol: clean_stt}
      - kind: code
        title: 발음 복원
        what: 긴 표현부터 바꾸고, '엘'처럼 일반 음절과 겹치는 것은 앞 단어가 맞을 때만 바꿉니다.
        ref: {file: pipeline/clean.py, symbol: restore_phonetic}
      - kind: code
        title: 사전으로 언급 찾기
        what: 사전의 이름 · 별칭을 긴 것부터 찾고, 코드는 앞뒤가 영숫자가 아닐 때만 인정합니다(H20이 H200 안에서 잡히지 않게).
        ref: {file: pipeline/clean.py, symbol: scan_mentions}
      - kind: config
        title: 정제 규칙의 패턴 · 단어 목록
        what: 회신 표시, 서명 패턴, 간투사 목록 등. 코드를 고치지 않고 여기서 바꿉니다.
        ref: {file: config/demo.yaml, key: cleaning}
      - kind: define
        title: 용어 사전 (별칭 · 동음 별칭의 맥락 단어)
        what: 하이닉스 → SK hynix 같은 별칭과, '삼성'처럼 여러 회사를 가리키는 말을 가를 맥락 단어.
        ref: {file: ontology/lexicon.v1.yaml, lines: [1, 24]}
      - kind: define
        title: STT 발음 표
        what: STT가 한글로 적은 약어 · 숫자를 원래 표기로.
        ref: {file: ontology/phonetic.yaml}
      - kind: platform
        title: 정규식 (re) · difflib
        did: import만
        gave: [패턴 매칭, 문자열 유사도]
  extract:
    label: 3 · 추출
    llm: true
    summary: 이 데모에서 LLM을 쓰는 유일한 단계입니다. LLM 호출 자체는 OpenAI 호환 API 한 번이고, 개발자가 한 일은 프롬프트를 쓰고, 온톨로지에서 관계 목록을 만들어 넣고, 답을 정리하고, 호출 기록을 저장한 것입니다. 모델 학습이나 파인튜닝은 하지 않았습니다.
    flow:
      - 정제된 조각을 '[조각 id] (화자) 텍스트' 줄로 묶어 user 메시지를 만듦 (build_messages)
      - 온톨로지에서 허용 관계 목록 · 클래스 목록을 글로 만듦 (schema_text)
      - 마스터에서 '알려진 개체' 목록을 만듦 (known_entities_text)
      - 직접 쓴 시스템 프롬프트(SYSTEM)에 위 두 목록을 채움
      - LLM 호출 — temperature 0, JSON 응답 요청 (llm.chat · llm._call)
      - 답에서 JSON만 꺼냄 — <think> · 코드 울타리 · 앞뒤 설명 제거 (llm.parse_json)
      - 형식이 틀린 후보를 정리하거나 버림 (normalize_output)
      - 호출 요청 · 응답 · 모델 · 프롬프트 해시를 runs/recorded/에 저장 → 다음엔 '이전 호출 재생'으로 같은 결과
    items:
      - kind: prompt
        title: 시스템 프롬프트 (실제로 LLM에 들어가는 글)
        what: 직접 쓴 규칙 12개 + 온톨로지에서 만든 관계 목록 + 알려진 개체 목록. 아래는 지금 파일로 채운 결과입니다.
        ref: {special: prompt_system}
      - kind: code
        title: 프롬프트 틀 (규칙 12개)
        what: 방향 지키기, 추정은 suspected로, 온톨로지 밖 관계는 따로, 근거 구절은 원문 그대로 복사 등. 첫 버전에서 LLM이 틀린 것을 보고 규칙을 늘렸습니다.
        ref: {file: pipeline/extract.py, symbol: SYSTEM}
      - kind: code
        title: 온톨로지 → 관계 목록
        what: 프롬프트의 관계 목록을 손으로 쓰지 않고 온톨로지 YAML에서 만듭니다. 온톨로지를 고치면 프롬프트도 따라 바뀝니다.
        ref: {file: pipeline/extract.py, symbol: schema_text}
      - kind: code
        title: 메시지 조립
        ref: {file: pipeline/extract.py, symbol: build_messages}
        what: 시스템 프롬프트와 조각 텍스트를 합칩니다.
      - kind: config
        title: LLM 호출 설정
        what: 어느 서버 · 어느 모델을 어떤 값으로 부르는지. 서버 주소와 모델 이름은 .env, 나머지는 config.
        ref: {special: llm_settings}
      - kind: code
        title: LLM 호출 · 이전 호출 재생
        what: live면 서버를 부르고 기록을 저장, replay면 저장된 기록을 씁니다. 프롬프트가 바뀌었으면 화면에 경고합니다.
        ref: {file: pipeline/llm.py, symbol: chat}
      - kind: code
        title: 답 정리
        what: JSON 꺼내기와 형식 정리. 오픈웨이트 모델이 형식을 흔들어도 다음 단계가 깨지지 않게.
        ref: {file: pipeline/extract.py, symbol: normalize_output}
      - kind: llm
        title: LLM이 맡은 일
        what: 조각을 읽고 ① 관계 목록 안의 사실 후보 ② 목록 밖 관계 ③ 모르는 용어 ④ 대상을 알 수 없는 표현을 JSON으로 돌려줍니다. 결과는 전부 후보이고, 맞는지는 다음 단계들이 판단합니다.
      - kind: platform
        title: LLM 서버 (OpenAI 호환 API · 이 PC는 :10000 → gpt-4.1)
        did: 주소와 모델 이름을 .env에 적음
        gave: [문장 이해와 JSON 생성]
  resolve:
    label: 4 · 연결
    llm: false
    summary: LLM이 적은 표현('하이닉스', '삼성', '마이크론 것')을 마스터의 어느 개체인지 정하는 판정기를 직접 짰습니다. LLM은 쓰지 않습니다. 같음 / 검토 / 미연결을 가르는 임계값은 설정에 있습니다.
    flow:
      - 정확한 별칭이면 같음 (조사 · '것'을 떼고도 확인)
      - 별칭이 여러 개체를 가리키면 주변 문장의 맥락 단어로 점수 (_by_context)
      - 제품 자리에 회사 이름이 오면 그 회사의 제품 후보 → 검토 (_company_for_product)
      - 긴 표현 안에 별칭이 하나 있으면 그것으로
      - 이 문서에서 이미 제안한 새 개체와 같은 표현이면 그것으로
      - 문자열 유사도는 후보로만 보여 주고, 코드는 유사도만으로 확정하지 않음
      - 마스터에 없는 제품이면 새 개체 후보
    items:
      - kind: code
        title: 판정기
        what: 위 순서의 본체. 판정마다 이유를 사람이 읽을 수 있는 글로 남깁니다.
        ref: {file: pipeline/resolve.py, symbol: Resolver.resolve}
      - kind: code
        title: 동음 별칭을 맥락으로 가르기
        ref: {file: pipeline/resolve.py, symbol: Resolver._by_context}
        what: 앞뒤 조각까지 보고 맥락 단어가 많은 쪽을 고릅니다. 단서가 약하면 검토로 보냅니다.
      - kind: code
        title: 단계 실행
        what: 사실의 주어 · 목적어, 목록 밖 관계, 모르는 용어, 지시어를 모두 같은 판정기로 연결합니다.
        ref: {file: pipeline/resolve.py, symbol: run}
      - kind: config
        title: 임계값
        what: accept 이상 같음, review 이상 검토, 그 아래 미연결.
        ref: {file: config/demo.yaml, key: resolve}
      - kind: platform
        title: difflib
        did: import만
        gave: [문자열 유사도]
  validate:
    label: 5 · 검증
    llm: false
    summary: 후보마다 승인 / 보류 / 기각 / 온톨로지 후보 / 질문을 정하는 규칙을 직접 짰습니다. 스키마 검사는 온톨로지 YAML을 읽어 자동으로 따라갑니다. LLM은 쓰지 않습니다.
    flow:
      - 스키마 — 관계가 온톨로지에 있고 주어 · 목적어 클래스와 방향이 맞는가
      - 개체 연결 — 주어 · 목적어가 연결됐는가 (같음 · 새 개체 · 검토 · 미연결)
      - 근거 문장 — LLM이 적은 근거 구절이 원문 조각에 그대로 있는가
      - 원천 대조 — 같은 사실을 적은 기사가 있는가, 반대 방향 사실만 있는가
      - 확신도 — 추정이면 근거가 있어도 확정하지 않음
      - 위 결과를 정해진 순서로 판정 (형식 오류 → 미연결 → 추정 → 검토 → 근거 없음 → 승인)
      - 목록 밖 관계 → 온톨로지 후보, 지시어 → 질문
    items:
      - kind: code
        title: 사실 하나의 검사
        what: 스키마 · 개체 연결 검사. 온톨로지의 from / to를 그대로 씁니다.
        ref: {file: pipeline/validate.py, symbol: check_fact}
      - kind: code
        title: 원천(기사) 대조
        what: 같은 관계 · 같은 개체(이름 토큰까지)의 기사를 찾고, 반대 방향 사실도 따로 찾습니다.
        ref: {file: pipeline/validate.py, symbol: supporting_articles}
      - kind: code
        title: 판정 순서와 나머지 분류
        what: 판정 규칙 본체와, 온톨로지 후보 · 용어 후보 · 질문 분류.
        ref: {file: pipeline/validate.py, symbol: run}
      - kind: config
        title: 고위험 관계
        what: 틀리면 비싼 관계. 근거 기사가 없으면 보류 사유에 '고위험'을 붙입니다.
        ref: {file: config/demo.yaml, key: validate}
      - kind: platform
        title: 없음
        did: 검증은 전부 직접 짠 코드입니다
        gave: []
  load:
    label: 6 · 적재
    llm: false
    summary: Neo4j에 쓰는 Cypher와 '변경 계획 → 반영 → 다시 계획해서 0인지 확인' 흐름을 직접 짰습니다. Neo4j가 해 준 것은 저장, MERGE 실행, 유니크 제약 확인입니다.
    flow:
      - 검증 결과와 현재 그래프를 비교해 바꿀 것만 목록으로 (build_plan, 아직 쓰지 않음)
      - 목록을 실제로 씀 — 노드는 키로 MERGE, 관계는 그다음 (apply)
      - 보류 · 질문 · 온톨로지 후보도 ReviewItem · OntologyCandidate 노드로 남김
      - 같은 입력으로 다시 계획을 세워 바꿀 것이 0인지 확인 (멱등)
      - Browser에서 색으로 보이게 DiffNew · DiffChanged · DiffHold 라벨을 붙임 (mark_diff)
    items:
      - kind: code
        title: 변경 계획 (staging)
        ref: {file: pipeline/load.py, symbol: build_plan}
        what: 문서 · 조각 · 언급 · 상태 변경 · 새 관계 · 검토 항목을 계산합니다.
      - kind: code
        title: 반영 (publish)
        ref: {file: pipeline/load.py, symbol: apply}
        what: 계획된 작업마다 실제 Cypher를 실행합니다. 상태를 바꿀 때 이전 값을 status_prev에 남깁니다.
      - kind: code
        title: 멱등 확인
        ref: {file: pipeline/load.py, symbol: run}
        what: 반영 뒤 계획을 다시 세워 변경이 0인지 결과에 기록합니다.
      - kind: config
        title: 그래프 패널 질의
        what: 버튼마다 Neo4j Browser 입력창에 채울 Cypher.
        ref: {file: config/demo.yaml, key: views}
      - kind: platform
        title: Neo4j 5 Community · neo4j Python 드라이버
        did: 연결 정보만 .env에
        gave: [Cypher 실행, 트랜잭션, 유니크 제약]
  compare:
    label: 비교 · 결과
    llm: false
    summary: run 0과의 차이 질의, 업무 질문 전/후 비교, 온톨로지 변경 제안 파일 생성을 직접 짰습니다. 그래프 그림은 Neo4j Browser를 그대로 씁니다.
    flow:
      - run 0 이후 생긴 노드 · 관계 · 상태 변경 · 근거 추가를 질의 (graph_diff)
      - CQ 5개를 다시 실행해 run 0 답과 나란히 (run_cq · compare)
      - 온톨로지 후보를 모아 v1.1 제안 파일로 저장 — 자동 반영하지 않음 (ontology_proposal)
    items:
      - kind: code
        title: 차이 질의
        ref: {file: pipeline/diff.py, symbol: graph_diff}
        what: run_id · first_run · status_changed_run 속성으로 전/후를 가릅니다(Community는 DB가 하나라서).
      - kind: code
        title: 온톨로지 변경 제안
        ref: {file: pipeline/diff.py, symbol: ontology_proposal}
        what: 제안만 파일로 남기고, 온톨로지 파일은 사람이 고칩니다.
      - kind: platform
        title: Neo4j Browser
        did: 수정 없이 iframe으로 띄움 (헤더만 빼는 중계 포트 경유)
        gave: [그래프 그림, 질의 실행 화면]
notes:
  # 단계별로 실제로 어려웠던 점 · 신경 쓴 점 (토글 화면 맨 아래에 표시)
  collect:
    hard: ["입력이 md라 형식은 단순했지만, 실제 메일 · STT는 소스마다 형식 변환기가 따로 필요함"]
    care: ["원본 파일은 절대 수정하지 않음", "수집 시각과 작성 시각을 따로 기록"]
  clean:
    hard: ["'엘' '포' 같은 발음은 일반 한국어 음절과 겹쳐서, 앞 단어가 CoWoS · HBM일 때만 바꾸게 해야 했음",
           "조사가 띄어 쓰여 나오는 STT 출력 ('HBM3E 는') 정리", "'삼성' 'SK'처럼 한 별칭이 여러 회사를 가리킴"]
    care: ["지운 줄마다 이유를 남김 → 화면에서 무엇을 왜 지웠는지 보여 줌", "날짜는 본문을 바꾸지 않고 정규화 표에만 기록",
           "H20 / H200처럼 비슷한 코드는 경고만 하고 합치지 않음"]
  extract:
    hard: ["첫 프롬프트(v1)는 관계 방향을 자주 뒤집음 (HBM3E DEVELOPS 하이닉스)",
           "추정 문장('얘기가 돈다')을 사실에서 빼 버림 → 규칙 11로 suspected 유지를 명시",
           "작은 모델(gpt-4.1-mini)은 규칙을 늘려도 불안정 → gpt-4.1로 교체. 그래도 USES_COMPONENT 방향은 여전히 틀림",
           "온톨로지 밖 관계 이름을 실행마다 다르게 붙임 (PARTNERS_WITH / JOINT_DEVELOPMENT)"]
    care: ["LLM 출력은 전부 '후보' — 다음 단계에서 검증", "온톨로지에 없는 관계 · 용어를 버리지 않고 따로 모음",
           "근거 구절을 원문 그대로 복사하게 해서 나중에 대조 가능"]
  resolve:
    hard: ["'NVIDIA 블랙웰' 같은 복합 표현 — 안쪽 별칭 중 클래스가 맞는 것을 골라야 함",
           "'마이크론 것'처럼 회사 이름으로 제품을 가리키는 표현", "LLM이 '하이닉스랑 TSMC'처럼 두 개체를 한 칸에 넣음"]
    care: ["애매하면 합치지 않고 '검토'로 남김", "코드(H20/H200)는 유사도만으로 절대 확정하지 않음",
           "판정 이유를 사람이 읽을 수 있게 남김"]
  validate:
    hard: ["'원천'을 무엇으로 볼지: 뉴스 도메인에서는 기사 원문이 원천 — 사내 메일 · 회의 발언은 기사로 확인될 때만 확정",
           "새 제품은 아직 uid가 없어서 이름 토큰으로 기사와 맞춰야 했음"]
    care: ["추정은 근거가 있어도 확정으로 올리지 않음", "보류도 결과로 그래프에 남김 (ReviewItem)",
           "온톨로지 후보는 자동 반영하지 않고 제안 파일로만"]
  load:
    hard: ["Community는 DB가 1개라 전/후를 DB로 나눌 수 없음 → run_id · first_run · status_prev 속성으로 구분",
           "집계 뒤 ORDER BY에서 집계 전 변수를 쓰면 Cypher 오류 → 별칭으로 정렬",
           "존재 · 타입 제약은 Enterprise 전용이라 필수 속성 검사는 파이프라인이 맡음"]
    care: ["노드 키로 하나씩 MERGE 후 관계 MERGE (패턴 전체 MERGE 함정 회피)", "삭제 대신 이전 값 보존 (status_prev)",
           "APOC · GDS · n10s 같은 플러그인 없이 순수 Cypher"]
  compare:
    hard: ["Neo4j Browser는 iframe을 막는 헤더를 보냄 → 헤더만 지우는 중계 포트(:8801)를 둠",
           "Browser URL로 질의를 채울 수는 있지만 자동 실행은 안 됨 → 실행 버튼은 직접 누름"]
    care: ["그래프 그림은 Neo4j 것을 그대로 쓰고, 과정 설명 화면만 직접 만듦"]
