# Implementation notes per step - shown in the web ("구현 노트") and summarised in DEV_NOTES.md.
# used  = platform / library taken as-is · built = written for this demo
# hard  = what was actually difficult      · care  = what we paid attention to
collect:
  used: ["Python 표준 라이브러리 (hashlib · pathlib)", "YAML 머리말 파싱 (PyYAML)"]
  built: ["수집 기록 스키마 (source_id · sha256 · version · ingested_at)", "같은 해시면 같은 버전으로 보는 판단"]
  hard: ["입력이 md라 형식은 단순했지만, 실제 메일 · STT는 소스마다 형식 변환기가 따로 필요함"]
  care: ["원본 파일은 절대 수정하지 않음", "수집 시각과 작성 시각을 따로 기록"]
clean:
  used: ["정규식 (re)", "문자열 유사도 (difflib, 표준 라이브러리)"]
  built: ["메일: 회신 체인 · 인용 · 서명 · 고지문 제거 규칙", "STT: 화자 매핑 · 간투사 · 반복 · (불명확) 처리",
          "STT 발음 복원 표 (에이치비엠 쓰리 이 → HBM3E) 와 '앞 단어 조건' 규칙",
          "상대 날짜 해석 (어제 · 3월 · 상반기 → 작성일 기준)", "사전 스캔으로 언급 찾기 · 비슷한 코드 경고"]
  hard: ["'엘' '포' 같은 발음은 일반 한국어 음절과 겹쳐서, 앞 단어가 CoWoS · HBM일 때만 바꾸게 해야 했음",
         "조사가 띄어 쓰여 나오는 STT 출력 ('HBM3E 는') 정리", "'삼성' 'SK'처럼 한 별칭이 여러 회사를 가리킴"]
  care: ["지운 줄마다 이유를 남김 → 화면에서 무엇을 왜 지웠는지 보여 줌", "날짜는 본문을 바꾸지 않고 정규화 표에만 기록",
         "H20 / H200처럼 비슷한 코드는 경고만 하고 합치지 않음"]
extract:
  used: ["OpenAI 호환 Chat Completions API (demo는 :10000을 vLLM으로 인식)", "JSON 출력 모드 (response_format)"]
  built: ["온톨로지 YAML → 프롬프트 안의 관계 목록 · 클래스 목록 자동 생성", "추출 프롬프트 (규칙 12개)",
          "녹화 / 재생 (runs/recorded) — 발표 중 결과가 바뀌지 않게"]
  hard: ["첫 프롬프트(v1)는 관계 방향을 자주 뒤집음 (HBM3E DEVELOPS 하이닉스)",
         "추정 문장('얘기가 돈다')을 사실에서 빼 버림 → 규칙 11로 suspected 유지를 명시",
         "작은 모델(gpt-4.1-mini)은 규칙을 늘려도 불안정 → gpt-4.1로 교체. 그래도 USES_COMPONENT 방향은 여전히 틀림",
         "온톨로지 밖 관계 이름을 실행마다 다르게 붙임 (PARTNERS_WITH / JOINT_DEVELOPMENT)"]
  care: ["LLM 출력은 전부 '후보' — 다음 단계에서 검증", "온톨로지에 없는 관계 · 용어를 버리지 않고 따로 모음",
         "근거 구절을 원문 그대로 복사하게 해서 나중에 대조 가능"]
resolve:
  used: ["difflib 유사도 (표준 라이브러리)"]
  built: ["별칭 정확 일치 → 맥락 단어 점수 → '회사 이름으로 제품 지칭' → 유사도 순서의 판정기",
          "임계값 2개 (같음 0.80 / 검토 0.50)", "문서 안에서 새 제품 개체를 한 번만 만들기 (토큰 자카드)"]
  hard: ["'NVIDIA 블랙웰' 같은 복합 표현 — 안쪽 별칭 중 클래스가 맞는 것을 골라야 함",
         "'마이크론 것'처럼 회사 이름으로 제품을 가리키는 표현", "LLM이 '하이닉스랑 TSMC'처럼 두 개체를 한 칸에 넣음"]
  care: ["애매하면 합치지 않고 '검토'로 남김", "코드(H20/H200)는 유사도만으로 절대 확정하지 않음",
         "판정 이유를 사람이 읽을 수 있게 남김"]
validate:
  used: []
  built: ["온톨로지 기반 스키마 검사", "근거 구절이 실제 원문에 있는지 검사",
          "기사 코퍼스 대조 (같은 사실 · 반대 방향 사실 찾기)", "승인 / 보류 / 거절 / 온톨로지 후보 / 질문 판정 규칙",
          "STT 발음 복원에서 동의어(hidden label) 후보 만들기"]
  hard: ["'원천'을 무엇으로 볼지: 뉴스 도메인에서는 기사 원문이 원천 — 사내 메일 · 회의 발언은 기사로 확인될 때만 확정",
         "새 제품은 아직 uid가 없어서 이름 토큰으로 기사와 맞춰야 했음"]
  care: ["추정은 근거가 있어도 확정으로 올리지 않음", "보류도 결과로 그래프에 남김 (ReviewItem)",
         "온톨로지 후보는 자동 반영하지 않고 제안 파일로만"]
load:
  used: ["Neo4j 5 Community · Cypher · neo4j Python 드라이버", "유니크 제약 (Community에서 지원)"]
  built: ["staging = 변경 계획 계산, publish = 실제 쓰기", "재실행 후 변경 계획이 0인지 자동 확인",
          "ReviewItem · OntologyCandidate 노드", "Browser 색칠용 표시 라벨 (DiffNew · DiffChanged · DiffHold)"]
  hard: ["Community는 DB가 1개라 전/후를 DB로 나눌 수 없음 → run_id · first_run · status_prev 속성으로 구분",
         "집계 뒤 ORDER BY에서 집계 전 변수를 쓰면 Cypher 오류 → 별칭으로 정렬",
         "존재 · 타입 제약은 Enterprise 전용이라 필수 속성 검사는 파이프라인이 맡음"]
  care: ["노드 키로 하나씩 MERGE 후 관계 MERGE (패턴 전체 MERGE 함정 회피)", "삭제 대신 이전 값 보존 (status_prev)",
         "APOC · GDS · n10s 같은 플러그인 없이 순수 Cypher"]
compare:
  used: ["Neo4j Browser (그래프 그림)"]
  built: ["run 0 대비 그래프 diff 질의", "CQ 5개 전/후 비교", "온톨로지 v1 → v1.1 제안 파일 생성"]
  hard: ["Neo4j Browser는 iframe을 막는 헤더를 보냄 → 헤더만 지우는 중계 포트(:8801)를 둠",
         "Browser URL로 질의를 채울 수는 있지만 자동 실행은 안 됨 → 실행 버튼은 직접 누름"]
  care: ["그래프 그림은 Neo4j 것을 그대로 쓰고, 과정 설명 화면만 직접 만듦"]
