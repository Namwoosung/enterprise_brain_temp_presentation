# Names of models / vendors / people are fictional. Part and failure vocabulary follows public
# descriptions of plasma-etch / CVD / CMP chamber hardware. CUSTOMIZE: replace with your own master.
#
# fab / model / vendor     -> structural relations from the master (LOCATED_IN, INSTANCE_OF, MADE_BY)
# prompt: false            -> kept out of the LLM prompt's "known entities" list (graph + lexicon only)
