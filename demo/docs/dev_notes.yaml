# Implementation notes per step - shown in the web ("구현 노트") and summarised in DEV_NOTES.md.
# used  = platform / library taken as-is · built = written for this demo
# hard  = what was actually difficult      · care  = what we paid attention to
collect:
  used: ["Python 표준 라이브러리 (hashlib · pathlib · csv)", "YAML 머리말 파싱 (PyYAML)"]
  built: ["수집 기록 스키마 (doc_id · source_id · sha256 · version · ingested_at)", "같은 해시면 같은 버전으로 보는 판단",
          "CSV export는 머리말이 없어 메타데이터를 config에서 받음"]
  hard: ["입력이 md · CSV라 형식은 단순했지만, 실제 메일 · STT · CMMS는 소스마다 형식 변환기가 따로 필요함"]
  care: ["원본 파일은 절대 수정하지 않음", "수집 시각과 작성 시각을 따로 기록"]
clean:
  used: ["정규식 (re)", "문자열 유사도 (difflib, 표준 라이브러리)", "csv 모듈"]
  built: ["CMMS: 행 = 조각, 중복 행 제거 (wo_id + updated_at), 날짜 형식 통일 (2026/03/07 → 2026-03-07)",
          "메일: 회신 체인 · 인용 · 서명 · 고지문 제거 규칙", "STT: 화자 매핑 · 간투사 · 반복 · (불명확) 처리",
          "STT 발음 복원 표 (피티 브이 사십이 → PT-V42, 오백 밀리토르 → 500 mTorr)",
          "날짜 해석 (3/6 · 금요일 · 지난달 → 작성일 기준) · 단위 환산 (mTorr → Torr)",
          "사전 스캔으로 언급 찾기 · 마스터 코드 자동 등록 · 비슷한 코드 경고"]
  hard: ["'그'는 간투사일 때도, '그 건'처럼 지시어일 때도 있어 문장 맨 앞에서도 지우지 않기로 함",
         "조사가 띄어 쓰여 나오는 STT 출력 ('PT-V42 는') 정리",
         "EQ-017은 FAB마다 있는 코드라 사전에 코드만 넣으면 두 설비를 가리킴 → 'A동 17호기'처럼 FAB가 붙은 표현만 정확 별칭"]
  care: ["지운 줄마다 이유를 남김 → 화면에서 무엇을 왜 지웠는지 보여 줌", "날짜 · 단위는 본문을 바꾸지 않고 정규화 표에만 기록",
         "EQ-017 / EQ-071처럼 비슷한 코드는 경고만 하고 합치지 않음"]
extract:
  used: ["OpenAI 호환 Chat Completions API (demo는 :10000을 vLLM으로 인식)", "JSON 출력 모드 (response_format)"]
  built: ["CMMS: 열 → 관계 매핑 규칙 (config cmms_mapping) — LLM 없이 결정적", "온톨로지 YAML → 프롬프트 안의 관계 목록 · 클래스 목록 자동 생성",
          "문서 추출 프롬프트 (규칙 13개)", "녹화 / 재생 (runs/recorded) — 발표 중 결과가 바뀌지 않게"]
  hard: ["작업 번호가 없는 정비 작업('3/6 P/T V-42 교체')을 어떻게 표현할지 → 문서에서는 작업을 새로 만들지 않고 CMMS 작업과 연결만",
         "'금요일 교체 예정'을 LLM이 confirmed로 표시함 → 검증의 '예정 · 추정' 표현 검사로 막음",
         "LLM이 '설비 USED_PART_TYPE 부품'처럼 관계 방향 · 클래스를 틀리게 뽑음 → 스키마 검사가 거절"]
  care: ["LLM 출력은 전부 '후보' — 다음 단계에서 검증", "온톨로지에 없는 관계(증상 · PM 주기)를 버리지 않고 따로 모음",
         "근거 구절을 원문 그대로 복사하게 해서 나중에 대조 가능"]
resolve:
  used: ["difflib 유사도 (표준 라이브러리)"]
  built: ["별칭 · 마스터 코드 정확 일치 → 맥락 단어 점수(FAB) → 번호 없는 작업은 CMMS의 같은 설비 · 부품 · 날짜 작업 → 유사도 순서의 판정기",
          "임계값 2개 (같음 0.80 / 검토 0.50)", "같은 행의 다른 값(일련번호)이 가리키는 후보를 먼저 보여 주기"]
  hard: ["설비 키가 'FAB + 코드'라 코드만 같은 두 설비를 이름으로 합치면 안 됨 (Neo4j SimpleKGPipeline 기본 ER의 함정)",
         "메일의 '3/6 교체 완료'와 CMMS 완료 시각 3/7 10:20이 하루 다름 → 같은 작업인지 자동으로 정하지 않고 검토",
         "예정 작업은 CMMS 시작일과, 완료 작업은 완료일과 비교해야 함"]
  care: ["애매하면 합치지 않고 '검토'로 남김", "코드(EQ-071)는 유사도만으로 절대 확정하지 않음 — 일련번호가 가리켜도 자동 수정 안 함",
         "판정 이유를 사람이 읽을 수 있게 남김"]
validate:
  used: []
  built: ["온톨로지 기반 스키마 검사", "근거 구절이 실제 원문에 있는지 검사", "'추정 · 예정' 표현이 있는데 confirmed면 확정으로 보지 않음",
          "기준 시스템 대조 (작업 = CMMS, 알람 = 알람 로그) · 다르면 덮어쓰지 않고 보류", "CMMS 행은 한 단위 — 한 값이 보류면 행 전체 대기",
          "승인 / 보류 / 거절 / 온톨로지 후보 / 질문 판정 규칙", "STT 발음 복원에서 동의어(hidden label) 후보 만들기"]
  hard: ["문서와 CMMS가 다를 때 어느 쪽이 맞는지 프로그램이 알 수 없음 → 속성마다 기준 시스템을 정하고 불일치는 사람에게",
         "고장 원인은 '추정'이 정상인 관계라 SUSPECTED_CAUSE로 따로 두고, 그래도 고위험이라 사람 확인"]
  care: ["추정은 근거가 있어도 확정으로 올리지 않음 (CONFIRMED_CAUSE는 추정 근거면 거절)", "보류도 결과로 그래프에 남김 (ReviewItem)",
         "온톨로지 후보는 자동 반영하지 않고 제안 파일로만"]
load:
  used: ["Neo4j 5 Community · Cypher · neo4j Python 드라이버", "유니크 제약 (Community에서 지원)"]
  built: ["staging = 변경 계획 계산, publish = 실제 쓰기", "재실행 후 변경 계획이 0인지 자동 확인",
          "ReviewItem · OntologyCandidate 노드", "Browser 색칠용 표시 라벨 (DiffNew · DiffChanged · DiffHold)"]
  hard: ["Community는 DB가 1개라 전/후를 DB로 나눌 수 없음 → run_id · first_run · <속성>_prev 로 구분",
         "집계 뒤 ORDER BY에서 집계 전 변수를 쓰면 Cypher 오류 → 별칭으로 정렬",
         "존재 · 타입 제약은 Enterprise 전용이라 필수 속성 검사는 파이프라인이 맡음"]
  care: ["노드 키로 하나씩 MERGE 후 관계 MERGE (패턴 전체 MERGE 함정 회피)", "삭제 대신 이전 값 보존 (<속성>_prev)",
         "APOC · GDS · n10s 같은 플러그인 없이 순수 Cypher"]
compare:
  used: ["Neo4j Browser (그래프 그림)"]
  built: ["run 0 대비 그래프 diff 질의", "CQ 5개 전/후 비교 (FAB-B 이력이 섞이지 않는지 · 추정이 확정이 되지 않는지 포함)",
          "온톨로지 v1 → v1.1 제안 파일 생성"]
  hard: ["Neo4j Browser는 iframe을 막는 헤더를 보냄 → 헤더만 지우는 중계 포트(:8801)를 둠",
         "Browser URL로 질의를 채울 수는 있지만 자동 실행은 안 됨 → 실행 버튼은 직접 누름"]
  care: ["그래프 그림은 Neo4j 것을 그대로 쓰고, 과정 설명 화면만 직접 만듦"]
