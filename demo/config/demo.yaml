# Demo configuration. CUSTOMIZE: inputs, thresholds, cleaning patterns, CQs, Browser views.
paths:
  ontology: ontology/ontology.v1.yaml
  lexicon: ontology/lexicon.v1.yaml
  phonetic: ontology/phonetic.yaml
  entities: data/sources/entities.yaml
  corpus: data/sources/news_corpus.yaml
  runs: runs

inputs:
  - id: mail
    label: 메일 · HBM 공급망 기사 정리
    file: data/inputs/mail_hbm_update.md
  - id: stt
    label: STT 회의록 · 주간 회의
    file: data/inputs/meeting_weekly.stt.md

steps:
  - {id: collect,  label: 수집}
  - {id: clean,    label: 정제}
  - {id: extract,  label: 추출}
  - {id: resolve,  label: 연결}
  - {id: validate, label: 검증}
  - {id: load,     label: 적재}

cleaning:
  mail:
    thread_markers: ["-----Original Message-----", "-----원본 메시지-----"]
    signature_patterns: ['^\S+\s*\|\s*.+\|']          # "이름 | 팀 | 내선"
    disclaimer_patterns: ['^본 메일은', '^This e-?mail']
    closing_lines: ["감사합니다.", "감사합니다"]
  stt:
    fillers: ["어", "음", "저기"]                       # removed as standalone tokens
    leading_fillers: ["네", "그"]                       # removed only at the start of an utterance
    unclear_marker: "(불명확)"
    min_chars_after_clean: 8                           # shorter segments are dropped

resolve:
  accept: 0.80          # >= accept -> same entity
  review: 0.50          # review..accept -> human review; below -> no match
  context_window: 1     # neighbouring chunks used as context
  fuzzy_min: 0.60       # show fuzzy alternatives above this

validate:
  # relations whose wrong value would be costly -> always need a supporting source
  high_risk: [SUPPLIES, PRODUCT_STATUS]

llm:
  temperature: 0
  max_tokens: 2000

# Competency questions, run before (run 0) and after each load.
cq:
  - id: CQ1
    question: NVIDIA에 HBM3E를 공급하는 회사는? (확정 사실만)
    cypher: |
      MATCH (c:Company)-[r:SUPPLIES]->(:Company {uid:'Company:nvidia'})
      WHERE r.item = 'HBM3E' AND r.certainty = 'confirmed'
      RETURN c.name AS 회사, r.sources AS 근거 ORDER BY 회사
  - id: CQ2
    question: SK hynix HBM3E의 현재 상태와 근거는?
    cypher: |
      MATCH (p:Product {uid:'Product:skh-hbm3e-8h'})
      RETURN p.status AS 상태, p.status_prev AS 이전_상태, p.status_sources AS 근거
  - id: CQ3
    question: Blackwell B200의 제조 공정과 패키징은?
    cypher: |
      MATCH (p:Product {uid:'Product:nvidia-b200'})
      OPTIONAL MATCH (p)-[f:FABRICATED_BY]->(c:Company)
      OPTIONAL MATCH (p)-[:USES_TECH]->(t:Technology)
      RETURN c.name AS 위탁사, f.process AS 공정, collect(DISTINCT t.name) AS 기술
  - id: CQ4
    question: Samsung SDI와 연결된 HBM 관련 관계는? (ER이 맞으면 없음)
    cypher: |
      MATCH (s:Company {uid:'Company:samsung-sdi'})-[r]-(x)
      WHERE type(r) IN ['SUPPLIES','DEVELOPS'] OR x:Product
      RETURN type(r) AS 관계, x.name AS 대상
  - id: CQ5
    question: 확인이 필요한 항목(보류 · 질문)은?
    cypher: |
      MATCH (r:ReviewItem)
      RETURN r.kind AS 종류, r.summary AS 내용, r.reason AS 사유 ORDER BY r.rid

# Cypher shown in Neo4j Browser per screen (pre-filled with ?cmd=edit).
views:
  baseline: |
    MATCH p=(a)-[r]->(b) WHERE NOT a:Chunk AND NOT b:Chunk AND NOT a:Document AND NOT b:Document
      AND NOT a:ReviewItem AND NOT a:OntologyCandidate
    RETURN p
  document: |
    MATCH (d:Document {doc_id:$doc_id})-[:HAS_CHUNK]->(c:Chunk)
    OPTIONAL MATCH (c)-[m:MENTIONS]->(e)
    RETURN d, c, m, e
  diff: |
    MATCH (n) WHERE n:DiffNew OR n:DiffChanged OR n:DiffHold
    OPTIONAL MATCH p=(n)-[r]-(m) WHERE NOT m:Chunk
    RETURN n, p
  diff_rels: |
    MATCH p=(a)-[r]->(b) WHERE r.last_run = $run_id AND NOT type(r) IN ['HAS_CHUNK','MENTIONS']
    RETURN p
